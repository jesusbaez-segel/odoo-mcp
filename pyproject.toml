[project]
name = "odoo-mcp"
version = "0.1.1"
description = "Servidor MCP local para Odoo: proyectos, tableros kanban y acceso genérico al ORM"
authors = [{ name = "Jesús Báez", email = "jesusbclock@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9.0"]

[project.scripts]
odoo-mcp = "odoo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_mcp"]

[dependency-groups]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.uv]
# cryptography es dependencia indirecta (mcp -> pyjwt[crypto]) que no usamos:
# solo sirve para autenticacion HTTP y este servidor va por stdio. A partir de
# la 49 dejo de publicar rueda para macOS Intel y uv intenta compilarla desde
# el codigo fuente en Rust, lo que falla al cruzar de arm64 a x86_64 en CI.
# Hasta la 48.0.1 hay rueda universal2 que sirve para las dos arquitecturas.
constraint-dependencies = ["cryptography<49"]

