[project]
name = "odoo-mcp"
version = "0.1.0"
description = "Servidor MCP local para Odoo: proyectos, tableros kanban y acceso genérico al ORM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
odoo-mcp = "odoo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_mcp"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
